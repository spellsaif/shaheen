[package]
name = "shaheen_core"
version = "1.1.2"
edition = "2021"

[lib]
name = "shaheen_core"
crate-type = ["cdylib", "staticlib", "rlib"]


[dependencies]
solana-sdk = { version = "4.0" }
borsh = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10.3"
rand = { version = "0.8", features = ["getrandom"] }
p256 = { version = "0.13", features = ["ecdh", "arithmetic", "ecdsa"] }
hkdf = "0.12"
sha2 = "0.10"
tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
url = "2.5"
base64 = "0.21"
bincode = "1.3"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
bs58 = "0.5"
hex = "0.4"


[[bench]]
name = "crypto_bench"
harness = false



